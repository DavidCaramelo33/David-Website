<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — David Caramelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f4ee;--panel:#fffdf9;--side:#1d1c1a;--ink:#1d1c1a;--muted:#6b665d;--line:#e2dccf;--accent:#9a7b4f;--accent-dark:#7a6038;--ok:#5f7f4f;--danger:#a24a3b;
    --serif:"Cormorant Garamond",Georgia,serif;--sans:"Inter","Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
  a{color:inherit}
  button,input,textarea,select{font:inherit;color:inherit}
  h1,h2{font-family:var(--serif);font-weight:500}
  h1{font-size:2.1rem;line-height:1.15}
  h2{font-size:1.5rem}
  [hidden]{display:none!important}

  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .login form{background:var(--panel);border:1px solid var(--line);padding:44px 40px;width:100%;max-width:400px;display:grid;gap:16px}
  .login h1{text-align:center}
  .login p{color:var(--muted);text-align:center;font-size:.9rem;margin-top:-6px}

  /* layout */
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  aside{background:var(--side);color:#cfc9bd;padding:28px 18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  .brand{font-family:var(--serif);font-size:1.5rem;color:#fff;padding:0 12px 24px}
  .brand span{color:var(--accent)}
  aside button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  aside button:hover{background:#2c2a27;color:#fff}
  aside button.on{background:#34312c;color:#fff}
  .badge{background:var(--accent);color:#fff;font-size:.72rem;border-radius:20px;padding:1px 8px}
  aside .spacer{flex:1}
  aside a{padding:10px 12px;font-size:.9rem;text-decoration:none}
  main{padding:36px 40px 80px;max-width:1100px;width:100%}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .menu{display:none}

  /* ui */
  .btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:10px 18px;border-radius:6px;cursor:pointer;font-size:.88rem;font-weight:500}
  .btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--ink)}
  .btn.danger{background:transparent;color:var(--danger);border-color:#e5c7c1}
  .btn.danger:hover{background:var(--danger);color:#fff}
  .btn.sm{padding:6px 11px;font-size:.8rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
  .stat b{display:block;font-family:var(--serif);font-size:2.4rem;font-weight:500;line-height:1.1}
  .stat span{color:var(--muted);font-size:.85rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
  .chart{display:flex;align-items:flex-end;gap:3px;height:150px;margin-top:18px}
  .chart div{flex:1;background:#d9ccb5;border-radius:2px 2px 0 0;min-height:2px;position:relative}
  .chart div:hover{background:var(--accent)}
  .chart div:hover::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:.72rem;padding:3px 7px;border-radius:4px;white-space:nowrap;margin-bottom:4px}
  .chart-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin-top:6px}
  .rows .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
  .rows .r:last-child{border:0}
  .rows .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muted{color:var(--muted)}
  .list{display:grid;gap:10px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;gap:16px;align-items:center}
  .item .info{flex:1;min-width:0}
  .item .t{font-weight:500}
  .item .s{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .item img{width:64px;height:48px;object-fit:cover;border-radius:4px}
  .pill{font-size:.72rem;padding:2px 9px;border-radius:20px;background:#ece6da;color:var(--muted);margin-left:8px;font-weight:400}
  .pill.live{background:#e1ead9;color:var(--ok)}
  .msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .msg.unread{border-left:3px solid var(--accent)}
  .msg .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .msg p{white-space:pre-wrap;color:#3b3934}
  .msg .acts{margin-top:12px;display:flex;gap:6px}

  /* forms */
  .form{display:grid;gap:16px}
  label{display:grid;gap:6px;font-size:.85rem;font-weight:500}
  label small{font-weight:400;color:var(--muted)}
  input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],input:not([type]),textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:400}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(154,123,79,.15)}
  textarea{min-height:90px;resize:vertical}
  textarea.big{min-height:380px;font-family:ui-monospace,Consolas,monospace;font-size:.88rem;line-height:1.6}
  .check{display:flex;align-items:center;gap:8px;font-weight:400}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .img-field{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .img-field img{width:120px;height:80px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  .form-actions{display:flex;gap:10px;position:sticky;bottom:0;background:var(--bg);padding:14px 0;border-top:1px solid var(--line)}
  .tabs{display:flex;gap:6px;margin-bottom:-1px}
  .tabs button{border:1px solid var(--line);background:#efeae0;padding:6px 14px;border-radius:6px 6px 0 0;cursor:pointer;font-size:.82rem}
  .tabs button.on{background:#fff;border-bottom-color:#fff}
  .preview{border:1px solid var(--line);border-radius:0 6px 6px 6px;background:#fff;padding:24px 28px;min-height:380px;font-size:1rem}
  .preview h2{font-size:1.8rem;margin:1em 0 .4em}.preview p,.preview ul,.preview blockquote{margin-bottom:1em}
  .preview ul{padding-left:1.2em}.preview img{max-width:100%}
  .preview blockquote{border-left:2px solid var(--accent);padding-left:16px;font-style:italic}
  .help{font-size:.8rem;color:var(--muted);background:#efeae0;border-radius:6px;padding:10px 12px}
  .help code{background:#fff;padding:1px 5px;border-radius:3px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:.9rem;z-index:99;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
  .toast.err{background:var(--danger)}
  .empty{color:var(--muted);padding:30px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:10px}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    aside{position:fixed;inset:0 auto 0 0;width:250px;z-index:60;transform:translateX(-100%);transition:transform .25s}
    body.nav-open aside{transform:none}
    .menu{display:inline-block}
    main{padding:20px 16px 80px}
    .stats{grid-template-columns:1fr 1fr}
    .grid2,.row2{grid-template-columns:1fr}
    .item{flex-wrap:wrap}
    .item .acts{width:100%;justify-content:flex-start}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login" hidden>
  <form id="login-form">
    <h1>Admin</h1>
    <p>Sign in to manage your website</p>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Sign in</button>
    <div class="muted" id="login-note" style="font-size:.85rem;text-align:center"></div>
  </form>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
  <aside>
    <div class="brand">D<span>.</span>C Admin</div>
    <button data-view="dashboard">Dashboard</button>
    <button data-view="messages">Messages <span class="badge" id="unread-badge" hidden></span></button>
    <button data-view="posts">Blog posts</button>
    <button data-view="projects">Projects</button>
    <button data-view="experience">Experience</button>
    <button data-view="education">Education</button>
    <button data-view="profile">Profile &amp; About</button>
    <div class="spacer"></div>
    <a href="index.html" target="_blank">View website ↗</a>
    <button id="logout">Sign out</button>
  </aside>
  <main>
    <div class="top">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn ghost sm menu" id="menu">☰</button>
        <h1 id="view-title"></h1>
      </div>
      <div id="view-actions"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="setup-note" class="login" hidden>
  <div class="card" style="max-width:520px">
    <h1>Almost there</h1>
    <p class="muted" style="margin-top:10px">The admin panel isn't connected to your database yet. Once the Supabase details are added to <b>config.js</b>, this page will show the sign-in screen.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="site.js"></script>
<script src="admin.js"></script>
</body>
</html>
